[project]
name = "voice-input-client"
version = "0.1.0"
description = "F9 push-to-talk voice input client; calls omlx ASR over OpenAI-compatible HTTP."
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7",
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["client"]
